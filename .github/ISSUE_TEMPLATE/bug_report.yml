name: Bug report
description: Report a reproducible problem with Hik-Connect NVR.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Never include an AppKey, SecretKey, access token, device serial number,
        or temporary stream URL.
  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.8.0"
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Hik-Connect NVR version
      placeholder: "0.3.3"
    validations:
      required: true
  - type: dropdown
    id: stream_quality
    attributes:
      label: Selected stream
      options:
        - Main stream (HD)
        - Sub stream (SD)
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Remove all credentials, tokens, serial numbers and stream URLs.
      render: text
